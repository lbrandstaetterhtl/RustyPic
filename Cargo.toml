[package]
name = "RustyPic"
version = "0.1.0"
edition = "2024"

[dependencies]
candle-core = "0.11.0"
candle-nn = "0.11.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = "0.25"
shell-words = "1.1.1"
flate2 = "1"
imageproc = "0.27.0"
chrono = "0.4.45"
clearscreen = "5.0.0"

[profile.release]
lto = true
codegen-units = 1
